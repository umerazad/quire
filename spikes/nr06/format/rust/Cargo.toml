[package]
name = "nr06-format-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone package: keeps this spike out of the quire workspace and its Cargo.lock.
[workspace]

[dependencies]
dprint-plugin-typescript = { version = "0.96.1", optional = true }
dprint-plugin-json = { version = "0.25.2", optional = true }
dprint-plugin-markdown = { version = "0.28.2", optional = true }
malva = { version = "0.16.0", optional = true }
markup_fmt = { version = "0.27.6", optional = true }
pretty_yaml = { version = "0.6.0", optional = true }
anyhow = { version = "1", optional = true }
rquickjs = { version = "0.14.0", optional = true, features = ["futures"] }

[features]
dprint = ["dep:dprint-plugin-typescript", "dep:dprint-plugin-json", "dep:dprint-plugin-markdown", "dep:malva", "dep:markup_fmt", "dep:pretty_yaml", "dep:anyhow"]
quickjs = ["dep:rquickjs"]

[[bin]]
name = "fmt_dprint"
path = "src/fmt_dprint.rs"
required-features = ["dprint"]

[[bin]]
name = "fmt_quickjs"
path = "src/fmt_quickjs.rs"
required-features = ["quickjs"]

[[bin]]
name = "baseline"
path = "src/baseline.rs"

[profile.release]
strip = true
