[package]
name = "nr06-pdf-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone package: keeps this spike out of the quire workspace and its Cargo.lock.
[workspace]

[dependencies]
pdfium-render = { version = "0.9.4", optional = true }
hayro = { version = "0.8.0", optional = true }
mupdf = { version = "0.8.0", optional = true, default-features = false, features = ["base14-fonts"] }
png = "0.17"

[features]
pdfium = ["dep:pdfium-render"]
hayro = ["dep:hayro"]
mupdf = ["dep:mupdf"]

[[bin]]
name = "bench_mupdf"
path = "src/bench_mupdf.rs"
required-features = ["mupdf"]

[[bin]]
name = "bench_pdfium"
path = "src/bench_pdfium.rs"
required-features = ["pdfium"]

[[bin]]
name = "bench_hayro"
path = "src/bench_hayro.rs"
required-features = ["hayro"]

[profile.release]
strip = true

[[bin]]
name = "diff_png"
path = "src/diff_png.rs"
