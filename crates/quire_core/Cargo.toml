[package]
name = "quire_core"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/quire_core.rs"

[dependencies]
jiff = "=0.2.15"
unicode-normalization = "=0.1.25"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ryu-js = "=1.0.2"
regex = { workspace = true, features = ["unicode-gencat"] }
icu_collator = "=2.3.0"
