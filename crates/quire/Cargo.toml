[package]
name = "quire"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
unicode-segmentation.workspace = true
text.workspace = true
editor = { workspace = true, optional = true }
language = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
theme_settings = { workspace = true, optional = true }
release_channel = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
vim = { workspace = true, optional = true }
assets = { workspace = true, optional = true }
util = { workspace = true, features = ["debug-embed"], optional = true }
zed_actions = { workspace = true, optional = true }

[features]
default = ["full-editor"]
test-support = ["gpui/test-support", "gpui_platform/test-support"]
full-editor = ["dep:editor", "dep:language", "dep:settings", "dep:theme", "dep:theme_settings", "dep:release_channel", "dep:semver", "dep:vim", "dep:assets", "dep:util", "dep:zed_actions"]
