[package]
name = "quire"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
unicode-segmentation.workspace = true
text.workspace = true
editor = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }
search = { workspace = true, optional = true }
workspace = { workspace = true, optional = true }
language = { workspace = true, optional = true }
multi_buffer = { workspace = true, optional = true }
grammars = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
theme_settings = { workspace = true, optional = true }
release_channel = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
vim = { workspace = true, optional = true }
assets = { workspace = true, optional = true }
util = { workspace = true, features = ["debug-embed"], optional = true }
zed_actions = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["full-editor"]
test-support = ["gpui/test-support", "gpui_platform/test-support"]
full-editor = ["dep:editor", "dep:ui", "dep:http_client", "dep:search", "dep:workspace", "dep:language", "dep:multi_buffer", "dep:grammars", "dep:tree-sitter-md", "dep:settings", "dep:theme", "dep:theme_settings", "dep:release_channel", "dep:semver", "dep:vim", "dep:assets", "dep:util", "dep:zed_actions"]
