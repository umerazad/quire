[package]
name = "quire"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
quire_core = { workspace = true, optional = true }
quire_store = { workspace = true, optional = true }
quire_format = { workspace = true, optional = true }
quire_media = { workspace = true, optional = true }
image = { workspace = true, optional = true }
reqwest_client = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rope = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
unicode-segmentation.workspace = true
text.workspace = true
editor = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }
search = { workspace = true, optional = true }
workspace = { workspace = true, optional = true }
language = { workspace = true, optional = true }
multi_buffer = { workspace = true, optional = true }
buffer_diff = { workspace = true, optional = true }
markdown = { workspace = true, optional = true }
grammars = { workspace = true, optional = true }
tree-sitter-quire-markdown = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-jsdoc = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-regex = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
theme_settings = { workspace = true, optional = true }
release_channel = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
vim = { workspace = true, optional = true }
vim_mode_setting = { workspace = true, optional = true }
assets = { workspace = true, optional = true }
util = { workspace = true, features = ["debug-embed"], optional = true }
zed_actions = { workspace = true, optional = true }
picker = { workspace = true, optional = true }
menu = { workspace = true, optional = true }
db = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
project = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
fs = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
jiff = { version = "=0.2.15", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
async_zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
net = { workspace = true, optional = true }

[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
base64.workspace = true
sqlez.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tree-sitter-md.workspace = true
fs = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSSpellChecker", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSNotification", "NSOperation", "NSString", "block2"] }

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple.workspace = true

[features]
default = ["full-editor"]
test-support = ["gpui/test-support", "gpui_platform/test-support"]
full-editor = ["dep:quire_core", "dep:quire_store", "dep:quire_format", "dep:quire_media", "dep:image", "dep:reqwest_client", "dep:futures", "dep:rope", "dep:uuid", "dep:editor", "dep:ui", "dep:http_client", "dep:search", "dep:workspace", "dep:language", "dep:multi_buffer", "dep:grammars", "dep:tree-sitter-quire-markdown", "dep:tree-sitter", "dep:tree-sitter-bash", "dep:tree-sitter-cpp", "dep:tree-sitter-css", "dep:tree-sitter-html", "dep:tree-sitter-jsdoc", "dep:tree-sitter-json", "dep:tree-sitter-python", "dep:tree-sitter-regex", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-yaml", "dep:settings", "dep:theme", "dep:theme_settings", "dep:release_channel", "dep:semver", "dep:vim", "dep:vim_mode_setting", "dep:assets", "dep:util", "dep:zed_actions", "dep:picker", "dep:menu", "dep:db", "dep:serde_json", "dep:serde", "dep:project", "dep:anyhow", "dep:fs", "dep:paths", "dep:buffer_diff", "dep:markdown", "dep:smol", "dep:jiff", "dep:sha2", "dep:hex", "dep:rand", "dep:async_zip", "dep:quick-xml", "dep:net"]
