[package]
name = "quire_media"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/quire_media.rs"

[dependencies]
quire_core.workspace = true
base64.workspace = true
regex.workspace = true
futures.workspace = true
image.workspace = true
resvg.workspace = true
usvg.workspace = true
# The bindings feature must match the pinned library build in `PDFIUM_BUILD` (src/pdf/library.rs).
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
hayro = "=0.8.0"

[dev-dependencies]
tempfile.workspace = true
